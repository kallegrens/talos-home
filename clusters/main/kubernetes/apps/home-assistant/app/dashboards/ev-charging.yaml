title: EV Charging
views:
  - title: EV Charging
    path: ev
    icon: mdi:ev-station
    type: sections
    max_columns: 2
    sections:
      - title: Charge Request
        cards:
          - type: tile
            entity: input_boolean.ev_charge_requested
            name: Schedule EV Charge
            icon: mdi:ev-station
            color: green
            vertical: true
            tap_action:
              action: toggle

          - type: tile
            entity: input_boolean.ev_charge_kill_switch
            name: Emergency Stop
            icon: mdi:stop-circle
            color: red
            vertical: true
            tap_action:
              action: toggle

          - type: tile
            entity: input_number.ev_target_soc
            name: Known Vehicle Target SOC
            icon: mdi:battery-charging-80
            color: blue
            tap_action:
              action: none
            features:
              - type: custom:service-call
                entries:
                  - type: slider
                    entity_id: input_number.ev_target_soc
                    range:
                      - 10
                      - 100
                    step: 1
                    unit_of_measurement: "%"
                    tap_action:
                      action: perform-action
                      perform_action: input_number.set_value
                      data:
                        value: "{{ value }}"
                      target:
                        entity_id: input_number.ev_target_soc

          - type: tile
            entity: input_number.ev_target_energy_kwh
            name: Guest Energy to Add
            icon: mdi:battery-charging
            color: teal
            tap_action:
              action: none
            features:
              - type: custom:service-call
                entries:
                  - type: slider
                    entity_id: input_number.ev_target_energy_kwh
                    range:
                      - 1
                      - 100
                    step: 0.1
                    unit_of_measurement: "kWh"
                    tap_action:
                      action: perform-action
                      perform_action: input_number.set_value
                      data:
                        value: "{{ value }}"
                      target:
                        entity_id: input_number.ev_target_energy_kwh

          - type: tile
            entity: input_datetime.ev_ready_by
            name: Ready By
            icon: mdi:clock-end
            color: amber
            tap_action:
              action: none
            features:
              - type: custom:service-call
                entries:
                  - type: input
                    entity_id: input_datetime.ev_ready_by
                    thumb: datetime-local
                    range:
                      - "{{ now().replace(minute=0, second=0).strftime('%Y-%m-%dT%H:%M') }}"
                      - >-
                        {{ (now() + timedelta(days=7)).replace(minute=0, second=0).strftime('%Y-%m-%dT%H:%M') }}
                    step: 300
                    tap_action:
                      action: perform-action
                      perform_action: input_datetime.set_datetime
                      data:
                        datetime: "{{ value }}"
                      target:
                        entity_id: input_datetime.ev_ready_by

          - type: tile
            entity: sensor.ev_plan_status
            name: Plan Status
            color: primary

      - title: EVCC Overview
        cards:
          # Requires the configured ha-evcc integration and the HACS
          # hass-evcc-card resource registered by HACS in Lovelace resources.
          - type: custom:evcc-card
            mode: flow
            title: Energy Flow
            size: large
            site_details: collapsed

          - type: custom:evcc-card
            mode: stats
            title: Charging Statistics
            stats_period: month

      - title: Cabin
        cards:
          - type: tile
            entity: climate.driveway_volkswagen_id4_climate_control
            name: Cabin Climate
            icon: mdi:car-seat-heater
            color: deep-orange
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - heat_cool
                  - "off"
              - type: target-temperature

          - type: tile
            entity: switch.driveway_volkswagen_id4_window_heating
            name: Window Defrost
            icon: mdi:car-defrost-front
            color: cyan
            tap_action:
              action: toggle

      - title: Live Status
        cards:
          - type: tile
            entity: sensor.evcc_loadpoint_1_soc
            name: Car SOC
            icon: mdi:car-battery
            color: green

          - type: tile
            entity: sensor.ev_plan_progress
            name: Charge Progress
            color: blue

          - type: tile
            entity: sensor.ev_plan_time_remaining
            name: Time Remaining
            color: amber

          - type: tile
            entity: sensor.ev_plan_energy_needed
            name: Energy Needed
            color: cyan

          - type: tile
            entity: sensor.evcc_loadpoint_1_power
            name: Charger Power
            icon: mdi:flash
            color: orange

          - type: tile
            entity: sensor.evcc_loadpoint_1_mode
            name: EVCC Mode
            icon: mdi:state-machine
            color: primary

          - type: tile
            entity: sensor.evcc_loadpoint_1_charging
            name: Charging
            icon: mdi:ev-station

          - type: tile
            entity: sensor.evcc_loadpoint_1_vehicle
            name: Vehicle
            icon: mdi:car-electric

          - type: tile
            entity: sensor.p_deferrable0
            name: EMHASS Planned Power
            icon: mdi:chart-timeline-variant

          - type: tile
            entity: sensor.evcc_loadpoint_1_phases
            name: Active Phases
            icon: mdi:transmission-tower

          - type: tile
            entity: sensor.evcc_loadpoint_1_configured_phases
            name: Configured Phases
            icon: mdi:transmission-tower

          - type: tile
            entity: sensor.evcc_loadpoint_1_max_current
            name: Maximum Current
            icon: mdi:current-ac

          - type: tile
            entity: input_boolean.ev_emhass_executor_active
            name: EMHASS Executor
            icon: mdi:robot

      - title: History
        cards:
          - type: history-graph
            title: Charger Power (24h)
            hours_to_show: 24
            entities:
              - entity: sensor.evcc_loadpoint_1_power
                name: Actual
              - entity: sensor.p_deferrable0
                name: EMHASS planned

          - type: history-graph
            title: Car SOC (48h)
            hours_to_show: 48
            entities:
              - entity: sensor.evcc_loadpoint_1_soc
                name: SOC

          - type: tile
            entity: sensor.evcc_loadpoint_1_charged_energy
            name: Current Session Energy
            icon: mdi:battery-charging-high
            color: green
