              - type: custom:service-call
                entries:
                  - type: slider
                    entity_id: input_number.body_target_deficit_kcal
                    range:
                      - 200
                      - 1000
                    step: 50
                    unit_of_measurement: "kcal"
                    tap_action:
                      action: perform-action
                      perform_action: input_number.set_value
                      data:
                        value: "{{ value }}"
                      target:
                        entity_id: input_number.body_target_deficit_kcal

  # ===========================================================================
  # VIEW 2: Complete Metric Glossary & Reference Guide
  # ===========================================================================
  - title: Metric Glossary & Guide
    path: glossary
    icon: mdi:book-open-page-variant
    type: sections
    max_columns: 2
    sections:
      - title: 1. True Muscle & Tissue Isolators
        cards:
          - type: markdown
            title: Cellular & Contractile Muscle Tissue
            content: >-
              ### **Body Cell Mass (BCM)**
              * **What it is**: The total weight of all living, metabolically active cells (skeletal muscle, cardiac muscle, smooth muscle, and organ cells), completely excluding body water, fat, and bone minerals.
              * **Why it matters**: BCM is the **gold standard clinical marker** for muscle retention. As you lose 30+ kg, your total scale weight will drop rapidly, but your BCM line should stay flat. If BCM drops, you are losing living cell tissue.

              ---

              ### **Skeletal Muscle Mass (SMM)**
              * **What it is**: The voluntary muscle tissue attached to your skeleton that you build and protect with resistance training.
              * **Skeletal Muscle %**: $(\text{SMM} / \text{Weight}) \times 100$. This percentage will naturally climb as fat mass is shed.

              ---

              ### **Dry Lean Body Mass (DLBM)**
              * **What it is**: Lean Body Mass minus Total Body Water ($\text{LBM} - \text{TBW}$).
              * **Why it matters**: Standard scales often claim you "lost 1.5 kg of muscle" in 2 days when you cut carbohydrates or train hard because muscle is ~73% water and glycogen stores drop. DLBM strips out fluid noise to monitor real structural protein mass.

      - title: 2. Forbes' Rule & Loss Kinetics
        cards:
          - type: markdown
            title: Forbes' Rule & Rate of Loss
            content: >-
              ### **Forbes' Rule ($\Delta$FFM Lean Mass Loss %)**
              * **Formula**: $(\Delta \text{Lean Mass} / \Delta \text{Total Weight}) \times 100$
              * **Interpretation**:
                * 🟢 **< 15% (Optimal)**: Over 85% of weight lost came strictly from body fat. Muscle is fully protected.
                * 🟡 **15% – 25% (Acceptable)**: Standard calorie deficit rate without heavy lifting.
                * 🔴 **> 25% (High Lean Loss Alert)**: Caloric deficit is too large or protein intake is insufficient. Increase calories or protein.
                * 🔵 **< 0% (Body Recomposition)**: You burned fat and built muscle simultaneously!

              ---

              ### **Weekly Rate of Loss (% WoW)**
              * **Target**: **0.5% – 1.0%** of total body weight per week.
              * **Why**: Academic sports science literature proves that losing $>1.0\%$ of body weight per week mathematically forces the body to catabolize skeletal muscle for fuel. At 116 kg, optimal loss is ~0.6–1.1 kg/wk.

      - title: 3. Recomposition Ratios & Hydration
        cards:
          - type: markdown
            title: Balance Ratios & Hydration Noise
            content: >-
              ### **Fat to Skeletal Muscle Ratio**
              * **Current**: ~1.16 (1.16 kg fat for every 1.0 kg muscle).
              * **Goal**: Decrease toward **< 0.50** (twice as much muscle as fat).

              ---

              ### **Skeletal Muscle to Fat Ratio (SMR)**
              * **Current**: ~0.86.
              * **Goal**: Increase above **> 1.50** (athletic standard >1.0).

              ---

              ### **ECW / TBW Ratio (Fluid Distribution)**
              * **Normal Range**: $36.0\% - 39.0\%$.
              * **Interpretation**: Extracellular water (outside cells) divided by total water.
                * **> 39.5%**: High systemic inflammation, cortisol (diet stress), delayed onset muscle soreness (DOMS), or sodium retention.
                * **Scale Spikes**: If scale weight jumps +1.5 kg overnight and ECW/TBW jumps, it is **100% water retention**, not fat.

      - title: 4. Physique Indices & Metabolic Baseline
        cards:
          - type: markdown
            title: FFMI & Dynamic Energy Needs
            content: >-
              ### **Fat-Free Mass Index (FFMI)**
              * **Formula**: $\text{LBM (kg)} / \text{Height (m)}^2$.
              * **Classification**:
                * **< 18**: Below average muscularity
                * **18 – 20**: Average
                * **20 – 22**: Athletic / Well-trained
                * **22 – 25**: Elite natural muscularity (Your baseline: ~22.6)
              * **Goal**: Keep FFMI **> 21.5** as you drop toward 85 kg.

              ---

              ### **Dynamic Katch-McArdle BMR**
              * **Formula**: $370 + (21.6 \times \text{LBM})$.
              * **Why it's better**: Unlike standard Mifflin-St Jeor or scale estimates which overpredict calories for high body mass, Katch-McArdle is based strictly on metabolic lean tissue. It automatically updates your baseline energy needs every time you weigh in.
