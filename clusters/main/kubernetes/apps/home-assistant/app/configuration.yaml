# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:
# Text to speech
tts:
  - platform: google_translate

lovelace:
  mode: storage
  dashboards:
    ev-charging:
      mode: yaml
      title: EV Charging
      icon: mdi:ev-station
      show_in_sidebar: true
      filename: dashboards/ev-charging.yaml

group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
recorder:
  purge_keep_days: 365
  commit_interval: 3
  db_url: "postgresql://home-assistant:PLACEHOLDERPASSWORD@home-assistant-cnpg-main-rw:5432/home-assistant?client_encoding=utf8"

# ---------------------------------------------------------------------------
# Manual toggles
# ---------------------------------------------------------------------------
input_boolean:
  solar_panels_snow_covered:
    name: Solar panels snow covered
    icon: mdi:snowflake-alert
  emhass_send_tail_prices:
    name: EMHASS send tail prices (3rd day)
    icon: mdi:calendar-arrow-right
    initial: true
  ev_charge_requested:
    name: Schedule EV charge
    icon: mdi:ev-station
    initial: false
  ev_charge_kill_switch:
    name: EV charging emergency stop
    icon: mdi:stop-circle
    initial: false
  ev_emhass_executor_active:
    name: EMHASS EV executor active
    icon: mdi:robot
    initial: false
  mower_rain_override:
    name: Mower parked by rain
    icon: mdi:lawn-mower-off
    initial: false
  mower_rain_forecast:
    name: Rain forecast in next 4 hours
    icon: mdi:weather-pouring
    initial: false

input_datetime:
  emhass_last_publish:
    name: EMHASS last publish
    icon: mdi:heart-pulse
    has_date: true
    has_time: true
  ev_ready_by:
    name: EV ready by
    icon: mdi:clock-end
    has_date: true
    has_time: true
  mower_rain_stop_time:
    name: Mower rain stop time
    icon: mdi:weather-rainy
    has_date: true
    has_time: true

input_number:
  emhass_idle_streak:
    name: EMHASS consecutive idle count
    icon: mdi:counter
    min: 0
    max: 99999
    step: 1
    initial: 0
    mode: box
  ev_target_soc:
    name: EV target SOC
    icon: mdi:battery-charging-80
    min: 10
    max: 100
    step: 5
    initial: 80
    unit_of_measurement: "%"
    mode: slider
  ev_target_energy_kwh:
    name: Guest EV energy to add
    icon: mdi:battery-charging
    min: 1
    max: 100
    step: 0.1
    initial: 20
    unit_of_measurement: "kWh"
    mode: box
  evcc_saved_max_current:
    name: Saved EVCC maximum current
    min: 0
    max: 32
    step: 0.1
    initial: 16
    unit_of_measurement: "A"
    mode: box
  evcc_saved_phases:
    name: Saved EVCC configured phases
    min: 0
    max: 3
    step: 1
    initial: 0
    unit_of_measurement: "phases"
    mode: box
  evcc_saved_charged_energy:
    name: Saved EVCC session energy
    min: 0
    max: 500
    step: 0.1
    initial: 0
    unit_of_measurement: "kWh"
    mode: box
  mower_rain_event_mm:
    name: Mower rain event mm
    icon: mdi:cup-water
    min: 0
    max: 500
    step: 0.1
    initial: 0
    unit_of_measurement: "mm"
    mode: box

# ---------------------------------------------------------------------------
# EMHASS REST commands
# ---------------------------------------------------------------------------
rest_command:
  evcc_max_current:
    url: >-
      http://evcc.evcc.svc.cluster.local:7070/api/loadpoints/1/maxcurrent/{{ current | float(0) | round(1) }}
    method: POST
    timeout: 15

  emhass_mpc_optim:
    url: "http://emhass.emhass.svc.cluster.local:5000/action/naive-mpc-optim"
    method: POST
    content_type: "application/json"
    timeout: 300
    payload: >-
      {%- set curr_soc = states('sensor.emhass_soc_for_mpc') | float(0) / 100 -%}
      {%- set snow = is_state('input_boolean.solar_panels_snow_covered', 'on') -%}
      {%- set bms_no_discharge = is_state('binary_sensor.bms_discharge_disabled', 'on') -%}
      {%- set bms_no_charge = is_state('binary_sensor.bms_charge_disabled', 'on') -%}
      {%- set max_horizon_slots = 288 -%}
      {%- set slots_per_day = 96 -%}
      {%- set slot_minutes = 15 -%}
      {%- set all_buy = state_attr('sensor.emhass_buy_price_forecast', 'prices') | default({}, true) -%}
      {%- set all_sell = state_attr('sensor.emhass_sell_price_forecast', 'prices') | default({}, true) -%}
      {%- set t = now() -%}
      {%- set slot_epoch = as_timestamp(t.replace(minute=(t.minute // slot_minutes) * slot_minutes, second=0, microsecond=0)) -%}
      {%- set buy_dict = namespace(d={}) -%}
      {%- set sell_dict = namespace(d={}) -%}
      {%- for ts_key, price in all_buy.items() if as_timestamp(ts_key) >= slot_epoch -%}
        {%- set buy_dict.d = dict(buy_dict.d, **{ts_key: price}) -%}
      {%- endfor -%}
      {%- for ts_key, price in all_sell.items() if as_timestamp(ts_key) >= slot_epoch -%}
        {%- set sell_dict.d = dict(sell_dict.d, **{ts_key: price}) -%}
      {%- endfor -%}
      {%- set horizon = [sell_dict.d | length, max_horizon_slots] | min -%}
      {%- set ev_requested = is_state('input_boolean.ev_charge_requested', 'on') -%}
      {%- set ev_plugged = is_state('sensor.evcc_loadpoint_1_connected', 'true') -%}
      {%- set ev_soc_raw = states('sensor.evcc_loadpoint_1_soc') -%}
      {%- set ev_soc = ev_soc_raw | float(-1) -%}
      {%- set ev_vehicle = states('sensor.evcc_loadpoint_1_vehicle') -%}
      {%- set ev_is_guest = ev_vehicle in ['', 'guest', 'unknown', 'unavailable'] -%}
      {%- set ev_target = states('input_number.ev_target_soc') | float(80) -%}
      {%- set ev_guest_target_kwh = states('input_number.ev_target_energy_kwh') | float(20) -%}
      {%- set ev_battery_kwh = 77 -%}
      {%- set ev_charge_kw = 11.04 -%}
      {%- set ev_charge_overhead = 1.05 -%}
      {%- set slot_seconds = slot_minutes * 60 -%}
      {%- set ev_power_raw = states('sensor.evcc_loadpoint_1_power') -%}
      {%- set ev_power_available = ev_power_raw | is_number -%}
      {%- set ev_actual_power = ev_power_raw | float(0) -%}
      {%- set ev_ready_ts = state_attr('input_datetime.ev_ready_by', 'timestamp') | float(0) -%}
      {%- set ev_deadline_valid = ev_ready_ts > as_timestamp(now()) -%}
      {%- set ev_soc_active = ev_requested and ev_plugged and ev_soc >= 0 and ev_soc < ev_target and ev_deadline_valid -%}
      {%- set ev_guest_active = ev_requested and ev_plugged and ev_is_guest and ev_soc < 0 and ev_guest_target_kwh > 0 and ev_deadline_valid -%}
      {%- set ev_active = ev_soc_active or ev_guest_active -%}
      {%- if ev_active -%}
        {%- if ev_soc_active -%}
          {%- set ev_energy_kwh = (ev_target - ev_soc) / 100 * ev_battery_kwh -%}
        {%- else -%}
          {%- set ev_energy_kwh = ev_guest_target_kwh -%}
        {%- endif -%}
        {%- set ev_hours_raw = (ev_energy_kwh / ev_charge_kw * ev_charge_overhead) | round(2) -%}
        {%- set ev_deadline_slots = ((ev_ready_ts - as_timestamp(now())) / slot_seconds) | int -%}
        {#- Deadline beyond horizon: defer scheduling until horizon catches up -#}
        {%- if ev_deadline_slots > horizon -%}
          {%- set ev_hours = 0 -%}
          {%- set ev_deadline = 0 -%}
        {%- else -%}
          {%- set ev_deadline = [[ev_deadline_slots, 1] | max, horizon] | min -%}
          {#- Cap hours to what physically fits in the deadline slots -#}
          {%- set max_ev_hours = (ev_deadline * slot_minutes / 60) | round(2) -%}
          {%- set ev_hours = [ev_hours_raw, max_ev_hours] | min -%}
        {%- endif -%}
      {%- else -%}
        {%- set ev_hours = 0 -%}
        {%- set ev_hours_raw = 0 -%}
        {%- set ev_deadline = 0 -%}
      {%- endif -%}
      {%- set ev_charging = is_state('sensor.evcc_loadpoint_1_charging', 'true') -%}
      {%- set ev_current_power = ev_actual_power if (ev_active and ev_charging and ev_power_available) else 0 -%}
      {
        "soc_init": {{ curr_soc }},
        "soc_final": {{ curr_soc }},
        "prediction_horizon": {{ horizon }},
        "operating_hours_of_each_deferrable_load": [{{ ev_hours }}],
        "def_current_state": [{{ (ev_active and ev_charging) | lower }}],
        "def_current_power": [{{ ev_current_power | round(0) }}],
        "treat_deferrable_load_as_semi_cont": [false],
        "set_deferrable_load_single_constant": [false],
        "end_timesteps_of_each_deferrable_load": [{{ ev_deadline }}],
        "load_cost_forecast": {{ buy_dict.d | tojson }},
        "prod_price_forecast": {{ sell_dict.d | tojson }},
        "battery_minimum_state_of_charge": {{ curr_soc if bms_no_discharge else 0.05 }},
        "battery_maximum_state_of_charge": {{ curr_soc if bms_no_charge else 1.0 }}
        {%- if snow -%}
          {%- set ypv = state_attr('sensor.pv_daily_profile', 'yesterday') | default([], true) -%}
          {%- set slot_idx = (now().hour * (slots_per_day // 24)) + (now().minute // slot_minutes) -%}
          {%- set ns = namespace(pv=[]) -%}
          {%- for i in range(horizon) -%}
            {%- set idx = (slot_idx + i) % slots_per_day -%}
            {%- if idx < ypv | length -%}
              {%- set ns.pv = ns.pv + [ypv[idx] | float(0)] -%}
            {%- else -%}
              {%- set ns.pv = ns.pv + [0] -%}
            {%- endif -%}
          {%- endfor -%}
          ,"pv_power_forecast": {{ ns.pv | tojson }}
        {%- endif %}
      }

  emhass_publish_data:
    url: "http://emhass.emhass.svc.cluster.local:5000/action/publish-data"
    method: POST
    content_type: "application/json"
    payload: "{}"
    timeout: 300

# ---------------------------------------------------------------------------
# Stable EVCC read bridge
# ---------------------------------------------------------------------------
# ha-evcc supplies the native controls and the dashboard integration. Keep
# these stable read aliases for EMHASS and existing automations so generated
# HACS entity names do not become part of the planner contract.
rest:
  - resource: "http://evcc.evcc.svc.cluster.local:7070/api/state"
    scan_interval: 10
    sensor:
      - name: "EVCC Loadpoint 1 Mode"
        unique_id: evcc_loadpoint_1_mode
        value_template: >-
          {{ value_json.loadpoints[0].mode }}
      - name: "EVCC Loadpoint 1 Connected"
        unique_id: evcc_loadpoint_1_connected
        value_template: >-
          {{ value_json.loadpoints[0].connected | lower }}
      - name: "EVCC Loadpoint 1 Charging"
        unique_id: evcc_loadpoint_1_charging
        value_template: >-
          {{ value_json.loadpoints[0].charging | lower }}
      - name: "EVCC Loadpoint 1 Power"
        unique_id: evcc_loadpoint_1_power
        device_class: power
        unit_of_measurement: "W"
        state_class: measurement
        value_template: >-
          {{ value_json.loadpoints[0].chargePower | float(0) | round(0) }}
      - name: "EVCC Loadpoint 1 SOC"
        unique_id: evcc_loadpoint_1_soc
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        value_template: >-
          {{ value_json.loadpoints[0].vehicleSoc | float(-1) | round(1) }}
      - name: "EVCC Loadpoint 1 Vehicle"
        unique_id: evcc_loadpoint_1_vehicle
        value_template: >-
          {{ value_json.loadpoints[0].vehicleName | default('', true) }}
      - name: "EVCC Loadpoint 1 Phases"
        unique_id: evcc_loadpoint_1_phases
        unit_of_measurement: "phases"
        value_template: >-
          {{ value_json.loadpoints[0].phasesActive | int(0) }}
      - name: "EVCC Loadpoint 1 Configured Phases"
        unique_id: evcc_loadpoint_1_configured_phases
        unit_of_measurement: "phases"
        value_template: >-
          {{ value_json.loadpoints[0].phasesConfigured | int(0) }}
      - name: "EVCC Loadpoint 1 Max Current"
        unique_id: evcc_loadpoint_1_max_current
        device_class: current
        unit_of_measurement: "A"
        state_class: measurement
        value_template: >-
          {{ value_json.loadpoints[0].effectiveMaxCurrent | float(0) | round(1) }}
      - name: "EVCC Loadpoint 1 Min Current"
        unique_id: evcc_loadpoint_1_min_current
        device_class: current
        unit_of_measurement: "A"
        state_class: measurement
        value_template: >-
          {{ value_json.loadpoints[0].effectiveMinCurrent | float(0) | round(1) }}
      - name: "EVCC Loadpoint 1 Charged Energy"
        unique_id: evcc_loadpoint_1_charged_energy
        device_class: energy
        unit_of_measurement: "kWh"
        value_template: >-
          {{ value_json.loadpoints[0].chargedEnergy | float(0) | round(3) }}
      - name: "EVCC Loadpoint 1 Remaining Energy"
        unique_id: evcc_loadpoint_1_remaining_energy
        device_class: energy
        unit_of_measurement: "kWh"
        value_template: >-
          {{ value_json.loadpoints[0].chargeRemainingEnergy | float(0) | round(3) }}

# ---------------------------------------------------------------------------
# Template sensors
# ---------------------------------------------------------------------------
template:
  - sensor:
      - name: "EMHASS SOC For MPC"
        unique_id: emhass_soc_for_mpc
        unit_of_measurement: "%"
        state: >-
          {% set live_soc = states('sensor.goodwe_battery_state_of_charge') %}
          {% if live_soc | is_number %}
            {{ live_soc | float(0) | round(2) }}
          {% else %}
            {% set forecast_soc = states('sensor.soc_batt_forecast') %}
            {% set hb_ts = state_attr('input_datetime.emhass_last_publish', 'timestamp') %}
            {% set forecast_fresh = hb_ts is not none and (as_timestamp(now()) - hb_ts) <= 1200 %}
            {% if forecast_fresh and forecast_soc | is_number %}
              {{ forecast_soc | float(0) | round(2) }}
            {% else %}
              unknown
            {% endif %}
          {% endif %}

  # Thermia Legend 10 compatibility helper.
  # The upstream API currently exposes DHW as cooling_operational_status.
  # If a future hot_water_operational_status entity appears, prefer it.
  - binary_sensor:
      - name: "Thermia DHW Active"
        unique_id: thermia_dhw_active
        icon: mdi:water-boiler
        state: >-
          {% set hot_water_entity = 'binary_sensor.lavendelgangen_3_hot_water_operational_status' %}
          {% set hot_water_state = states(hot_water_entity) %}
          {% if hot_water_state not in ['unknown', 'unavailable'] %}
            {{ hot_water_state == 'on' }}
          {% else %}
            {{ is_state('binary_sensor.lavendelgangen_3_cooling_operational_status', 'on') }}
          {% endif %}

  # House consumption excluding the EV only while the HA schedule owns it.
  # When EVCC is operating independently, keep the actual EV load in the
  # baseline so EMHASS battery dispatch still sees the real house demand.
  - sensor:
      - name: "EV Charger Power"
        unique_id: ev_charger_power_w
        device_class: power
        unit_of_measurement: "W"
        state_class: measurement
        state: >-
          {{ states('sensor.evcc_loadpoint_1_power') | float(0) | round(0) }}

  # EMHASS needs load_no_var_loads = total consumption minus any loads
  # it schedules as deferrable, otherwise it double-counts them.
  - sensor:
      - name: "House Consumption No EV"
        unique_id: house_consumption_no_ev
        device_class: power
        unit_of_measurement: "W"
        state_class: measurement
        state: >-
          {% set total = states('sensor.goodwe_house_consumption') | float(0) %}
          {% set ready = state_attr('input_datetime.ev_ready_by', 'timestamp') | float(0) %}
          {% set scheduled = is_state('input_boolean.ev_charge_requested', 'on') and ready > as_timestamp(now()) %}
          {% set ev_w = states('sensor.ev_charger_power') | float(0) if scheduled else 0 %}
          {{ [total - ev_w, 0] | max | round(0) }}

      # HP Power Estimation — temp-dependent model from GoodWe correlation
      # Heating: linear fit R²=0.91, slope=-32.7 W/°C (compressor works harder when cold)
      # DHW: constant (temp effect not significant, p=0.30)
      # Calibrated from 131K samples, Jan-Mar 2026
      # UPSTREAM BUG: cooling_operational_status = actually DHW (issue #52)
      # https://github.com/klejejs/python-thermia-online-api/issues/52
      - name: "HP Heating Power"
        unique_id: hp_heating_power
        device_class: power
        unit_of_measurement: "W"
        state_class: measurement
        icon: mdi:radiator
        state: >-
          {% set comp = is_state('binary_sensor.lavendelgangen_3_compr_operational_status', 'on') %}
          {% set heating = is_state('binary_sensor.lavendelgangen_3_heating_operational_status', 'on') %}
          {% set dhw = is_state('binary_sensor.thermia_dhw_active', 'on') %}
          {% set brine = is_state('binary_sensor.lavendelgangen_3_brinepump_operational_status', 'on') %}
          {% set rad = is_state('binary_sensor.lavendelgangen_3_radiatorpump_operational_status', 'on') %}
          {% set t_out = states('sensor.lavendelgangen_3_outdoor_temperature') | float(0) %}
          {% set aux3 = is_state('binary_sensor.lavendelgangen_3_3kw_power_status', 'on') %}
          {% set aux6 = is_state('binary_sensor.lavendelgangen_3_6kw_power_status', 'on') %}
          {% set aux9 = is_state('binary_sensor.lavendelgangen_3_9kw_power_status', 'on') %}
          {% set aux12 = is_state('binary_sensor.lavendelgangen_3_12kw_power_status', 'on') %}
          {% set aux15 = is_state('binary_sensor.lavendelgangen_3_15kw_power_status', 'on') %}
          {% set aux_w = 15000 if aux15 else (12000 if aux12 else (9000 if aux9 else (6000 if aux6 else (3000 if aux3 else 0)))) %}
          {% set comp_brine_w = [(-32.7 * t_out + 2585) | round(0) | int, 500] | max if (comp and heating and not dhw) else 0 %}
          {% set rad_w = 244 if rad else 0 %}
          {{ (comp_brine_w + rad_w + (aux_w if (heating and not dhw) else 0)) | int }}

      - name: "HP Hot Water Power"
        unique_id: hp_hot_water_power
        device_class: power
        unit_of_measurement: "W"
        state_class: measurement
        icon: mdi:water-boiler
        state: >-
          {% set comp = is_state('binary_sensor.lavendelgangen_3_compr_operational_status', 'on') %}
          {% set dhw = is_state('binary_sensor.thermia_dhw_active', 'on') %}
          {% set brine = is_state('binary_sensor.lavendelgangen_3_brinepump_operational_status', 'on') %}
          {% set aux3 = is_state('binary_sensor.lavendelgangen_3_3kw_power_status', 'on') %}
          {% set aux6 = is_state('binary_sensor.lavendelgangen_3_6kw_power_status', 'on') %}
          {% set aux9 = is_state('binary_sensor.lavendelgangen_3_9kw_power_status', 'on') %}
          {% set aux12 = is_state('binary_sensor.lavendelgangen_3_12kw_power_status', 'on') %}
          {% set aux15 = is_state('binary_sensor.lavendelgangen_3_15kw_power_status', 'on') %}
          {% set aux_w = 15000 if aux15 else (12000 if aux12 else (9000 if aux9 else (6000 if aux6 else (3000 if aux3 else 0)))) %}
          {% set dhw_w = 3404 if (comp and dhw) else 0 %}
          {{ (dhw_w + (aux_w if dhw else 0)) | int }}

  - binary_sensor:
      - name: "EV charge request valid"
        unique_id: ev_charge_request_valid
        icon: mdi:ev-station
        state: >-
          {% set ready = state_attr('input_datetime.ev_ready_by', 'timestamp') | float(0) %}
          {{ ready > as_timestamp(now()) }}

  - trigger:
      - trigger: time
        at: "13:05:00"
      - trigger: event
        event_type: tibber_cache_refresh
      - trigger: template
        value_template: >-
          {{ state_attr('sensor.nordpool_kwh_se3_sek_3_10_0', 'tomorrow_valid') == true }}
    action:
      - action: tibber.get_prices
        data:
          start: "{{ today_at('00:00') }}"
          end: "{{ today_at('00:00') + timedelta(days=2) }}"
        response_variable: tibber_result
    sensor:
      - name: "Tibber Cached Prices"
        unique_id: tibber_cached_prices
        state: >-
          {{ tibber_result.prices['Lavendelgången 3'] | length }}
        unit_of_measurement: "entries"
        attributes:
          prices: >-
            {{ tibber_result.prices['Lavendelgången 3'] }}
          last_fetch: "{{ now().isoformat() }}"

  # Pre-computed buy/sell price forecasts for EMHASS.
  # Merges Tibber (incl. VAT+markup) with Nordpool (fallback), adds
  # energiskatt+nätavgift for buy, grid compensation for sell, and
  # appends a tail-extension day for horizon padding.
  # Triggers whenever Tibber cache or Nordpool data changes.
  - trigger:
      - trigger: state
        entity_id: sensor.tibber_cached_prices
      - trigger: state
        entity_id: sensor.nordpool_kwh_se3_sek_3_10_0
      - trigger: state
        entity_id: input_boolean.emhass_send_tail_prices
      - trigger: time_pattern
        minutes: "/15"
    sensor:
      - name: "EMHASS Buy Price Forecast"
        unique_id: emhass_buy_price_forecast
        unit_of_measurement: "SEK/kWh"
        state_class: measurement
        state: >-
          {%- set slot_minutes = 15 -%}
          {%- set t = now() -%}
          {%- set slot_key = t.replace(minute=(t.minute // slot_minutes) * slot_minutes, second=0, microsecond=0).strftime('%Y-%m-%d %H:%M:%S%z') -%}
          {%- set slot_key = slot_key[:-2] ~ ':' ~ slot_key[-2:] -%}
          {%- set prices = this.attributes.get('prices', {}) -%}
          {{ prices.get(slot_key) if prices.get(slot_key) is not none else none }}
        attributes:
          prices: >-
            {%- set energiskatt_och_natavgift = 0.607 -%}
            {%- set tibber_vat_multiplier = 1.25 -%}
            {%- set tibber_fixed_markup = 0.116 -%}
            {%- set seconds_per_day = 86400 -%}
            {%- set tibber_prices = state_attr('sensor.tibber_cached_prices', 'prices') | default([], true) -%}
            {%- set np_today = state_attr('sensor.nordpool_kwh_se3_sek_3_10_0', 'raw_today') | default([], true) -%}
            {%- set np_tomorrow = state_attr('sensor.nordpool_kwh_se3_sek_3_10_0', 'raw_tomorrow') | default([], true) -%}
            {%- set np_all = np_today + np_tomorrow -%}
            {%- set tibber_by_ts = namespace(d={}) -%}
            {%- for p in tibber_prices if p is mapping -%}
              {%- set ts_key = as_timestamp(p.start_time) | int | string -%}
              {%- set tibber_by_ts.d = dict(tibber_by_ts.d, **{ts_key: p.price}) -%}
            {%- endfor -%}
            {%- set buy_dict = namespace(d={}) -%}
            {%- for p in np_all if p is mapping -%}
              {%- set ts_key = as_timestamp(p.start) | int | string -%}
              {%- set tibber_price = tibber_by_ts.d.get(ts_key, none) -%}
              {%- if tibber_price is not none -%}
                {%- set buy_price = tibber_price -%}
              {%- else -%}
                {%- set buy_price = (p.value * tibber_vat_multiplier + tibber_fixed_markup) | round(4) -%}
              {%- endif -%}
              {%- set buy_dict.d = dict(buy_dict.d, **{p.start | string: (buy_price + energiskatt_och_natavgift) | round(4)}) -%}
            {%- endfor -%}
            {%- if is_state('input_boolean.emhass_send_tail_prices', 'on') -%}
              {%- set tail_src = np_tomorrow if np_tomorrow | length > 0 else np_today -%}
              {%- for p in tail_src if p is mapping -%}
                {%- set shifted_key = (as_timestamp(p.start) + seconds_per_day) | timestamp_local -%}
                {%- set buy_price = (p.value * tibber_vat_multiplier + tibber_fixed_markup + energiskatt_och_natavgift) | round(4) -%}
                {%- set buy_dict.d = dict(buy_dict.d, **{shifted_key: buy_price}) -%}
              {%- endfor -%}
            {%- endif -%}
            {{ buy_dict.d }}
          last_updated: "{{ now().isoformat() }}"

      - name: "EMHASS Sell Price Forecast"
        unique_id: emhass_sell_price_forecast
        unit_of_measurement: "SEK/kWh"
        state_class: measurement
        state: >-
          {%- set slot_minutes = 15 -%}
          {%- set t = now() -%}
          {%- set slot_key = t.replace(minute=(t.minute // slot_minutes) * slot_minutes, second=0, microsecond=0).strftime('%Y-%m-%d %H:%M:%S%z') -%}
          {%- set slot_key = slot_key[:-2] ~ ':' ~ slot_key[-2:] -%}
          {%- set prices = this.attributes.get('prices', {}) -%}
          {{ prices.get(slot_key) if prices.get(slot_key) is not none else none }}
        attributes:
          prices: >-
            {%- set grid_compensation = 0.047 -%}
            {%- set seconds_per_day = 86400 -%}
            {%- set np_today = state_attr('sensor.nordpool_kwh_se3_sek_3_10_0', 'raw_today') | default([], true) -%}
            {%- set np_tomorrow = state_attr('sensor.nordpool_kwh_se3_sek_3_10_0', 'raw_tomorrow') | default([], true) -%}
            {%- set np_all = np_today + np_tomorrow -%}
            {%- set sell_dict = namespace(d={}) -%}
            {%- for p in np_all if p is mapping -%}
              {%- set sell_dict.d = dict(sell_dict.d, **{p.start | string: (p.value + grid_compensation) | round(4)}) -%}
            {%- endfor -%}
            {%- if is_state('input_boolean.emhass_send_tail_prices', 'on') -%}
              {%- set tail_src = np_tomorrow if np_tomorrow | length > 0 else np_today -%}
              {%- for p in tail_src if p is mapping -%}
                {%- set shifted_key = (as_timestamp(p.start) + seconds_per_day) | timestamp_local -%}
                {%- set sell_price = (p.value + grid_compensation) | round(4) -%}
                {%- set sell_dict.d = dict(sell_dict.d, **{shifted_key: sell_price}) -%}
              {%- endfor -%}
            {%- endif -%}
            {{ sell_dict.d }}
          last_updated: "{{ now().isoformat() }}"

  # Yesterday's PV profile — 96 readings (one per 15-min slot).
  # Used by the MPC snow override: if panels are snow-covered, feed
  # yesterday's actual production instead of the clear-sky forecast.
  # Rolls over at the first sample after midnight each day.
  - trigger:
      - trigger: time_pattern
        minutes: "/15"
    sensor:
      - name: "PV Daily Profile"
        unique_id: pv_daily_profile
        state: >-
          {{ state_attr('sensor.pv_daily_profile', 'yesterday') | default([], true) | length }} entries
        attributes:
          today: >-
            {% set stored_date = this.attributes.get('date', '') %}
            {% set today_str = now().strftime('%Y-%m-%d') %}
            {% if stored_date != today_str %}
              {{ [states('sensor.goodwe_pv_power') | float(0)] }}
            {% else %}
              {{ this.attributes.get('today', []) + [states('sensor.goodwe_pv_power') | float(0)] }}
            {% endif %}
          yesterday: >-
            {% set stored_date = this.attributes.get('date', '') %}
            {% set today_str = now().strftime('%Y-%m-%d') %}
            {% if stored_date != today_str %}
              {{ this.attributes.get('today', []) }}
            {% else %}
              {{ this.attributes.get('yesterday', []) }}
            {% endif %}
          date: "{{ now().strftime('%Y-%m-%d') }}"

  # Grid power with flipped sign convention: positive = importing, negative = exporting.
  # Replaces the Tibber Pulse for real-time grid power in the Energy Dashboard.
  - sensor:
      - name: "Grid Power"
        unique_id: grid_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {{ -(states('sensor.goodwe_meter_active_power_total') | float(0)) }}

  # Snow detector: fires when forecast > min_forecast_w but actual < snow_threshold (5%).
  # An automation latches input_boolean.solar_panels_snow_covered ON
  # when this turns on. A separate automation clears the boolean when
  # actual PV recovers (> 50% of forecast for 30 min).
  - binary_sensor:
      - name: Solar Snow Detected
        unique_id: solar_snow_detected
        device_class: problem
        state: >-
          {% set min_forecast_w = 100 %}
          {% set snow_threshold = 0.05 %}
          {% set forecast = states('sensor.p_pv_forecast') | float(0) %}
          {% set actual = states('sensor.goodwe_pv_power') | float(0) %}
          {{ forecast > min_forecast_w and actual < forecast * snow_threshold }}
        icon: >-
          {{ 'mdi:snowflake-alert' if this.state == 'on' else 'mdi:solar-panel' }}

      # BMS limit detection — parsed from GoodWe diagnostic status register.
      # delay_on: flag must persist 2 min before clamp activates (debounce
      #   mode-switch noise — the diag register flips between "Charge time
      #   on" / "Discharge time on" every ~7 min but BMS flags stay stable).
      # delay_off: wait 5 min after BMS lifts restriction before unclamping
      #   (prevents oscillation at the BMS edge).
      # These feed into the MPC payload to set battery_minimum/maximum_soc
      # equal to current SOC, so EMHASS doesn't plan impossible actions.
      - name: BMS Discharge Disabled
        unique_id: bms_discharge_disabled
        device_class: problem
        delay_on:
          minutes: 2
        delay_off:
          minutes: 5
        state: >-
          {{ 'BMS: Discharge disabled' in states('sensor.goodwe_diag_status') }}
        icon: >-
          {{ 'mdi:battery-off-outline' if this.state == 'on' else 'mdi:battery' }}

      - name: BMS Charge Disabled
        unique_id: bms_charge_disabled
        device_class: problem
        delay_on:
          minutes: 2
        delay_off:
          minutes: 5
        state: >-
          {{ 'BMS: Charge disabled' in states('sensor.goodwe_diag_status') }}
        icon: >-
          {{ 'mdi:battery-charging-off' if this.state == 'on' else 'mdi:battery-charging' }}

  # ---------------------------------------------------------------------------
  # EV plan UI-layer sensors (for iOS widgets & mobile dashboard)
  # ---------------------------------------------------------------------------
  - trigger:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - input_boolean.ev_charge_requested
          - input_boolean.ev_charge_kill_switch
          - input_boolean.ev_emhass_executor_active
          - sensor.evcc_loadpoint_1_mode
          - sensor.evcc_loadpoint_1_connected
          - sensor.evcc_loadpoint_1_charging
          - sensor.evcc_loadpoint_1_power
          - sensor.evcc_loadpoint_1_soc
          - sensor.evcc_loadpoint_1_vehicle
          - input_number.ev_target_soc
          - input_number.ev_target_energy_kwh
          - input_datetime.ev_ready_by
    sensor:
      - name: "EV Plan Status"
        unique_id: ev_plan_status
        icon: >-
          {% set s = this.state %}
          {% if s in ['charging', 'solar charging', 'EVCC charging', 'scheduled charging'] %}mdi:ev-station
          {% elif s in ['scheduled', 'scheduled waiting'] %}mdi:calendar-clock
          {% elif s == 'complete' %}mdi:check-circle
          {% elif s == 'emergency stopped' %}mdi:stop-circle
          {% elif s == 'not home' %}mdi:car-off
          {% elif s == 'not plugged in' %}mdi:power-plug-off
          {% else %}mdi:ev-plug-type2
          {% endif %}
        state: >-
          {% set requested = is_state('input_boolean.ev_charge_requested', 'on') %}
          {% set executor = is_state('input_boolean.ev_emhass_executor_active', 'on') %}
          {% set mode = states('sensor.evcc_loadpoint_1_mode') %}
          {% set connected = is_state('sensor.evcc_loadpoint_1_connected', 'true') %}
          {% set charging = is_state('sensor.evcc_loadpoint_1_charging', 'true') %}
          {% set kill = is_state('input_boolean.ev_charge_kill_switch', 'on') %}
          {% set soc = states('sensor.evcc_loadpoint_1_soc') | float(-1) %}
          {% set target = states('input_number.ev_target_soc') | float(80) %}
          {% if kill and executor %}
            emergency stopped
          {% elif not connected %}
            not plugged in
          {% elif executor and soc >= 0 and soc >= target %}
            complete
          {% elif executor and mode == 'now' and charging %}
            scheduled charging
          {% elif executor and mode == 'now' %}
            scheduled
          {% elif executor %}
            scheduled waiting
          {% elif mode == 'pv' and charging %}
            solar charging
          {% elif mode == 'now' and charging %}
            EVCC charging
          {% elif mode == 'off' %}
            EVCC stopped
          {% else %}
            EVCC control
          {% endif %}

      - name: "EV Plan Progress"
        unique_id: ev_plan_progress_pct
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:progress-check
        state: >-
          {% set soc_raw = states('sensor.evcc_loadpoint_1_soc') %}
          {% set soc = soc_raw | float(-1) %}
          {% set vehicle = states('sensor.evcc_loadpoint_1_vehicle') %}
          {% set target = states('input_number.ev_target_soc') | float(0) %}
          {% set energy = states('sensor.evcc_loadpoint_1_charged_energy') | float(0) %}
          {% set energy_target = states('input_number.ev_target_energy_kwh') | float(0) %}
          {% if soc_raw | is_number and vehicle not in ['', 'guest', 'unknown', 'unavailable'] and target > 0 %}
            {{ [[((soc / target) * 100) | round(0), 0] | max, 100] | min }}
          {% elif energy_target > 0 %}
            {{ [[((energy / energy_target) * 100) | round(0), 0] | max, 100] | min }}
          {% else %}
            0
          {% endif %}

      - name: "EV Plan Time Remaining"
        unique_id: ev_plan_time_remaining
        icon: mdi:timer-sand
        state: >-
          {% set requested = is_state('input_boolean.ev_charge_requested', 'on') %}
          {% set ready_ts = state_attr('input_datetime.ev_ready_by', 'timestamp') | float(0) %}
          {% if not requested or ready_ts <= as_timestamp(now()) %}
            —
          {% else %}
            {% set secs = (ready_ts - as_timestamp(now())) | int %}
            {% if secs <= 0 %}
              overdue
            {% else %}
              {% set h = (secs // 3600) %}
              {% set m = ((secs % 3600) // 60) %}
              {{ (h ~ 'h ' if h > 0 else '') ~ m ~ 'm' }}
            {% endif %}
          {% endif %}

      - name: "EV Plan Energy Needed"
        unique_id: ev_plan_energy_needed
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:lightning-bolt
        state: >-
          {% set soc_raw = states('sensor.evcc_loadpoint_1_soc') %}
          {% set soc = soc_raw | float(-1) %}
          {% set vehicle = states('sensor.evcc_loadpoint_1_vehicle') %}
          {% set target = states('input_number.ev_target_soc') | float(80) %}
          {% set battery_kwh = 77 %}
          {% set overhead = 1.05 %}
          {% set guest_target = states('input_number.ev_target_energy_kwh') | float(0) %}
          {% if soc_raw | is_number and vehicle not in ['', 'guest', 'unknown', 'unavailable'] %}
            {% set needed = ((target - soc) / 100 * battery_kwh * overhead) %}
            {{ [needed, 0] | max | round(1) }}
          {% else %}
            {{ guest_target | round(1) }}
          {% endif %}

  # ---------------------------------------------------------------------------
  # Mower rain / lawn-dryness sensors (Conservative fail-safe physics & dew model)
  # ---------------------------------------------------------------------------
  # Trigger-based: recomputes every 5 min and whenever a key input changes.
  # Physics & Dew model:
  #   - Immediate 100% wetness if active rain, recent rain > 0.2mm, high humidity,
  #     or dew point depression (T - T_dew) < 2.0°C.
  #   - Target drying time:
  #       T_dry = (2.5h base + 0.75h/mm × event_mm) × f_temp × f_hum × f_solar × f_wind
  #       f_temp  = max(0.7, e^(-(T - 20) × 0.05))  — colder → slower
  #       f_hum   = max(0.6, 1 + (H - 50)/50)       — more humid → slower
  #       f_solar = max(0.5, 1 - (R/800) × 0.5)     — more sun → faster
  #       f_wind  = max(0.6, 1 - (W/10) × 0.4)      — more wind → faster
  #       Wetness = max(0, (T_dry - Δt) / T_dry × 100)
  - trigger:
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - input_datetime.mower_rain_stop_time
          - input_number.mower_rain_event_mm
          - input_boolean.mower_rain_forecast
          - sensor.wsmihp2550_pro_v1_6_9_outdoor_temperature
          - sensor.wsmihp2550_pro_v1_6_9_dewpoint
          - sensor.wsmihp2550_pro_v1_6_9_humidity
          - sensor.wsmihp2550_pro_v1_6_9_solar_radiation
          - sensor.wsmihp2550_pro_v1_6_9_wind_speed
          - sensor.wsmihp2550_pro_v1_6_9_rain_rate
          - sensor.wsmihp2550_pro_v1_6_9_hourly_rain
          - sensor.wsmihp2550_pro_v1_6_9_daily_rain
    sensor:
      - name: "Mower Lawn Wetness"
        unique_id: mower_lawn_wetness
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-percent
        state: >-
          {% set rain_stop = states('input_datetime.mower_rain_stop_time') %}
          {% set event_mm = states('input_number.mower_rain_event_mm') | float(0) %}
          {% set T = states('sensor.wsmihp2550_pro_v1_6_9_outdoor_temperature') | float(15) %}
          {% set T_dew = states('sensor.wsmihp2550_pro_v1_6_9_dewpoint') | float(15) %}
          {% set H = states('sensor.wsmihp2550_pro_v1_6_9_humidity') | float(70) %}
          {% set R = states('sensor.wsmihp2550_pro_v1_6_9_solar_radiation') | float(0) %}
          {% set W = states('sensor.wsmihp2550_pro_v1_6_9_wind_speed') | float(0) %}
          {% set rain_rate = states('sensor.wsmihp2550_pro_v1_6_9_rain_rate') | float(0) %}
          {% set hourly_rain = states('sensor.wsmihp2550_pro_v1_6_9_hourly_rain') | float(0) %}
          {% set daily_rain = states('sensor.wsmihp2550_pro_v1_6_9_daily_rain') | float(0) %}
          {% if rain_rate > 0.1 or hourly_rain >= 0.2 or H >= 88.0 or (T - T_dew) < 2.0 or daily_rain >= 12.0 %}
            100
          {% elif rain_stop in ('unknown', 'unavailable') or event_mm <= 0 %}
            0
          {% else %}
            {% set delta_h = (as_timestamp(now()) - as_timestamp(rain_stop)) / 3600 %}
            {% set f_temp = [(2.71828 ** (-(T - 20) * 0.05)), 0.7] | max %}
            {% set f_hum = [1 + (H - 50) / 50, 0.6] | max %}
            {% set f_solar = [1 - (R / 800) * 0.5, 0.5] | max %}
            {% set f_wind = [1 - (W / 10) * 0.4, 0.6] | max %}
            {% set t_dry = (2.5 + 0.75 * event_mm) * f_temp * f_hum * f_solar * f_wind %}
            {{ [((t_dry - delta_h) / t_dry * 100) | round(1), 0] | max }}
          {% endif %}

  - binary_sensor:
      - name: "Mower OK to Mow"
        unique_id: mower_ok_to_mow
        icon: mdi:lawn-mower
        state: >-
          {% set wetness = states('sensor.mower_lawn_wetness') | float(100) %}
          {% set rain_rate = states('sensor.wsmihp2550_pro_v1_6_9_rain_rate') | float(0) %}
          {% set hourly_rain = states('sensor.wsmihp2550_pro_v1_6_9_hourly_rain') | float(0) %}
          {% set daily_rain = states('sensor.wsmihp2550_pro_v1_6_9_daily_rain') | float(0) %}
          {% set T = states('sensor.wsmihp2550_pro_v1_6_9_outdoor_temperature') | float(15) %}
          {% set T_dew = states('sensor.wsmihp2550_pro_v1_6_9_dewpoint') | float(15) %}
          {% set H = states('sensor.wsmihp2550_pro_v1_6_9_humidity') | float(70) %}
          {% set R = states('sensor.wsmihp2550_pro_v1_6_9_solar_radiation') | float(0) %}
          {% set rain_fc = is_state('input_boolean.mower_rain_forecast', 'on') %}
          {{ wetness <= 0
             and rain_rate < 0.1
             and hourly_rain < 0.2
             and daily_rain < 12.0
             and (T - T_dew) >= 3.0
             and H <= 80.0
             and R >= 30.0
             and not rain_fc }}

# ---------------------------------------------------------------------------
# Riemann-sum energy sensors (power → kWh for Energy Dashboard)
# ---------------------------------------------------------------------------
sensor:
  - platform: integration
    source: sensor.hp_heating_power
    name: HP Heating Energy
    unique_id: hp_heating_energy
    unit_prefix: k
    unit_time: h
    method: left

  - platform: integration
    source: sensor.hp_hot_water_power
    name: HP Hot Water Energy
    unique_id: hp_hot_water_energy
    unit_prefix: k
    unit_time: h
    method: left

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.16.0.0/16
    - 172.17.0.0/16
