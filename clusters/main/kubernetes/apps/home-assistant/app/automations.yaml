# ===========================================================================
# Tibber Integration Health
# ===========================================================================

- id: "1770642990708"
  alias: Tibber Watchdog
  description: >-
    Checks every 5 min if Tibber pulse sensor is stale (>10 min).
    Attempts one reload; if it fails, sends a persistent notification.
  triggers:
    - minutes: /5
      trigger: time_pattern
  conditions:
    - condition: template
      value_template: >-
        {% set stale_threshold_sec = 600 %}
        {% set e = states.sensor.tibber_pulse_lavendelgangen_3_power %}
        {{ e is not none and (now() - e.last_updated).total_seconds() > stale_threshold_sec }}
  actions:
    - action: homeassistant.reload_config_entry
      target:
        entity_id: sensor.tibber_pulse_lavendelgangen_3_power
      continue_on_error: true
    - delay: 00:00:30
    - condition: template
      value_template: >-
        {% set stale_threshold_sec = 600 %}
        {% set e = states.sensor.tibber_pulse_lavendelgangen_3_power %}
        {{ e is none or (now() - e.last_updated).total_seconds() > stale_threshold_sec }}
    - action: persistent_notification.create
      data:
        title: "Tibber Integration Stuck"
        message: >-
          Tibber pulse sensor stale >10 min and reload failed.
          HA restart required. Time: {{ now().isoformat() }}
        notification_id: tibber_stuck
  mode: single

- id: "1770700000005"
  alias: Tibber Cache - Populate on Startup
  description: >-
    Waits 3 min after HA start for Tibber to fully load, then fires
    a custom event that the template sensor can listen for.
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - delay: "00:03:00"
    - event: tibber_cache_refresh
  mode: single

# ===========================================================================
# EMHASS MPC Optimization
# ===========================================================================

- id: "1770700000006"
  alias: EMHASS MPC Loop
  description: >-
    Runs MPC every 4 min with dynamic prediction horizon matching
    available price data. After MPC completes, an explicit
    publish-data call posts results to HA sensors. This is a
    resilience measure: EMHASS's continual_publish background
    thread can crash silently, leaving sensors stale while MPC
    keeps running. The explicit publish ensures sensor freshness.
    Falls back to the last published SOC forecast for up to 20 min
    when GoodWe SOC telemetry is briefly unavailable, so EV
    scheduling does not stall on short inverter outages.
    4 min chosen because it is coprime with the 15-min price slot
    boundary (GCD=1), preventing systematic alignment flip-flop,
    while giving faster SOC feedback than the previous 7-min cycle.
  triggers:
    - minutes: /4
      trigger: time_pattern
    - trigger: state
      entity_id: input_boolean.ev_charge_requested
    - trigger: state
      entity_id:
        - input_number.ev_target_soc
        - input_datetime.ev_ready_by
        - sensor.evcc_loadpoint_1_soc
        - sensor.evcc_loadpoint_1_connected
        - sensor.evcc_loadpoint_1_charging
        - sensor.evcc_loadpoint_1_power
  conditions:
    - condition: template
      value_template: >-
        {{ (state_attr('sensor.nordpool_kwh_se3_sek_3_10_0', 'raw_today') | default([], true) | length > 0)
           and states('sensor.emhass_soc_for_mpc') | is_number }}
  actions:
    - action: rest_command.emhass_mpc_optim
    - delay:
        seconds: 2
    - action: rest_command.emhass_publish_data
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.emhass_last_publish
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  mode: single

# ===========================================================================
# GoodWe Battery Control
# ===========================================================================

- id: "1770700000003"
  alias: EMHASS Battery Control
  description: >-
    Translates EMHASS p_batt_forecast into GoodWe eco-mode commands.
    Triggered by MPC publishing a new forecast OR soc target change.

    Anti-jitter: consecutive-idle ≥2 filter. The MPC re-solves every
    ~4 min and often oscillates between charge/idle on adjacent slots.
    To prevent rapid mode-cycling on the inverter, we require the
    optimizer to say "idle" at least 2 consecutive times before we
    actually transition to idle. Charge/discharge decisions are acted
    on immediately. The streak counter lives in
    input_number.emhass_idle_streak.

    Decision and rate both come from the current slot p_batt value.
    Power % is |p_batt| / 5050W, clamped to 5-100%.

    eco_mode_soc buffer is computed dynamically from the MPC interval:
    buffer = 1.3 × max SOC change per cycle (at full power). This
    gives the inverter headroom to keep acting through the cycle
    without hitting the SOC limit before the next re-solve.

    Grid export limit is 10,000W in all modes. Battery→grid spill
    is prevented by EMHASS (set_nodischarge_to_grid) + eco_mode_power
    sizing. A 0W hardware limit caused PV curtailment on sunny days.

    Availability guard: skips when GoodWe sensors are unavailable.
    The goodwe library shares a _consecutive_failures_count between
    reads and writes. Failed writes poison the coordinator's failure
    threshold (3), causing sensors to go unavailable even faster.
    Skipping writes during outages lets the coordinator recover
    uncontested — see the Failsafe description for the full cascade.
  triggers:
    - trigger: state
      entity_id: sensor.p_batt_forecast
    - trigger: state
      entity_id: sensor.soc_batt_forecast
  conditions:
    - condition: template
      value_template: >-
        {{ states('sensor.p_batt_forecast') not in ['unknown', 'unavailable']
           and states('sensor.soc_batt_forecast') not in ['unknown', 'unavailable'] }}
    # Guard: don't attempt writes when the inverter is unreachable.
    # Write failures share the coordinator's _consecutive_failures_count
    # counter in the goodwe library. Hammering writes during an outage
    # pushes the counter past the threshold of 3, forcing the coordinator
    # to immediately mark sensors unavailable on its next poll — which
    # cascades into MPC Loop skipping and Failsafe write-storms.
    - condition: template
      value_template: >-
        {{ states('sensor.goodwe_battery_state_of_charge') not in ['unknown', 'unavailable'] }}
  actions:
    - variables:
        # --- Hardware constants ---
        inverter_rated_w: 10000
        batt_max_w: 5050
        batt_capacity_wh: 14200
        grid_export_limit_w: 10000
        grid_export_discharge_w: 10000
        min_power_pct: 5
        min_soc_pct: 5
        max_soc_pct: 100
        # GoodWe device_id for goodwe.set_parameter service
        goodwe_device_id: "ea2d8925fee08c1321c7f038b61e111e"
        # Default battery charge/discharge current (A)
        default_charge_current: 25
        default_discharge_current: 25
        # --- Tuning parameters ---
        mpc_interval_min: 4
        deadband_w: 200
        idle_streak_required: 2
        soc_buffer_safety_factor: 1.3
        soc_buffer_min_pct: 2
        default_soc: 50
        # --- Sensor readings ---
        p_batt: "{{ states('sensor.p_batt_forecast') | float(0) }}"
        target_soc: "{{ states('sensor.soc_batt_forecast') | float(default_soc) }}"
        # --- Derived values ---
        soc_buffer: >-
          {{ [((batt_max_w * mpc_interval_min / 60 / batt_capacity_wh * 100) * soc_buffer_safety_factor) | round(0) | int, soc_buffer_min_pct] | max }}
        # Max eco_mode_power % the battery can physically deliver/absorb
        max_power_pct: "{{ (batt_max_w / inverter_rated_w * 100) | round(0) | int }}"
        # Power % of inverter rated power, clamped [min_power_pct .. max_power_pct]
        # GoodWe firmware interprets eco_mode_power as % of inverter_rated_w (10kW),
        # NOT battery max. E.g. 20% = 2000W cap on charge/discharge rate.
        # Upper clamp = batt_max_w/inverter_rated_w ≈ 50% (battery can't exceed 5050W).
        power_pct: >-
          {{ [[(( p_batt | float | abs) / inverter_rated_w * 100) | round(0) | int, min_power_pct] | max, max_power_pct | int] | min }}
        # Decision from current slot
        raw_decision: >-
          {% if p_batt | float < -deadband_w %}charge
          {% elif p_batt | float > deadband_w %}discharge
          {% else %}idle{% endif %}
        # Read and update idle streak
        prev_streak: "{{ states('input_number.emhass_idle_streak') | int(0) }}"
        new_streak: >-
          {% if raw_decision == 'idle' %}{{ prev_streak + 1 }}
          {% else %}0{% endif %}
        # Final decision: suppress idle unless streak reaches threshold
        decision: >-
          {% if raw_decision == 'idle' and new_streak | int < idle_streak_required %}hold
          {% else %}{{ raw_decision }}{% endif %}
    # Always persist the streak counter
    - action: input_number.set_value
      target:
        entity_id: input_number.emhass_idle_streak
      data:
        value: "{{ new_streak }}"
    - choose:
        # --- CHARGE ---
        # eco_charge: grid+PV → battery at controlled rate.
        # Order matters: set eco mode FIRST, then restore currents
        # AFTER a delay. The work_mode register write inside
        # set_operation_mode can reset battery current registers,
        # so they must be written last to stick.
        - conditions:
            - condition: template
              value_template: "{{ decision == 'charge' }}"
          sequence:
            - action: select.select_option
              target:
                entity_id: select.goodwe_ems_mode
              data:
                option: auto
            - action: number.set_value
              target:
                entity_id: number.goodwe_grid_export_limit
              data:
                value: "{{ grid_export_limit_w }}"
            - action: number.set_value
              target:
                entity_id: number.goodwe_eco_mode_power
              data:
                value: "{{ power_pct }}"
            - action: number.set_value
              target:
                entity_id: number.goodwe_eco_mode_soc
              data:
                value: "{{ [target_soc | round(0) | int + soc_buffer | int, max_soc_pct] | min }}"
            - action: select.select_option
              target:
                entity_id: select.goodwe_inverter_operation_mode
              data:
                option: eco_charge
            - delay:
                seconds: 2
            - action: goodwe.set_parameter
              data:
                device_id: "{{ goodwe_device_id }}"
                parameter: battery_charge_current
                value: "{{ default_charge_current }}"
            - action: goodwe.set_parameter
              data:
                device_id: "{{ goodwe_device_id }}"
                parameter: battery_discharge_current
                value: "{{ default_discharge_current }}"

        # --- DISCHARGE ---
        # eco_discharge: battery → house at controlled rate.
        # grid_export_limit=0 prevents battery→grid spill.
        # Order matters: set eco mode FIRST, then restore currents
        # AFTER a delay. The work_mode register write inside
        # set_operation_mode can reset battery current registers
        # (observed: idle→discharge stuck at 0A without this).
        - conditions:
            - condition: template
              value_template: "{{ decision == 'discharge' }}"
          sequence:
            - action: select.select_option
              target:
                entity_id: select.goodwe_ems_mode
              data:
                option: auto
            - action: switch.turn_on
              target:
                entity_id: switch.goodwe_grid_export_limit_switch
            - action: number.set_value
              target:
                entity_id: number.goodwe_grid_export_limit
              data:
                value: "{{ grid_export_discharge_w }}"
            - action: number.set_value
              target:
                entity_id: number.goodwe_eco_mode_power
              data:
                value: "{{ power_pct }}"
            - action: number.set_value
              target:
                entity_id: number.goodwe_eco_mode_soc
              data:
                value: "{{ [target_soc | round(0) | int - soc_buffer | int, min_soc_pct] | max }}"
            - action: select.select_option
              target:
                entity_id: select.goodwe_inverter_operation_mode
              data:
                option: eco_discharge
            - delay:
                seconds: 2
            - action: goodwe.set_parameter
              data:
                device_id: "{{ goodwe_device_id }}"
                parameter: battery_charge_current
                value: "{{ default_charge_current }}"
            - action: goodwe.set_parameter
              data:
                device_id: "{{ goodwe_device_id }}"
                parameter: battery_discharge_current
                value: "{{ default_discharge_current }}"

        # --- IDLE (streak reached) ---
        # Uses general mode + EMS charge_pv (limit=0W):
        # - general mode = normal self-use base
        # - EMS charge_pv overrides self-use to prevent discharge
        # - limit=0 means charge = 0 + PV_power: only PV charges
        #   the battery, no grid→battery charging occurs
        # - BMS maintains ~47W trickle (unavoidable hardware min)
        # - When PV is available, surplus charges battery naturally
        #
        # Why not eco_charge? eco schedule dominates EMS layer;
        # eco_charge always charges at eco_mode_power% of rated
        # power (min 500W at 5%). The EMS layer is ignored.
        #
        # Why not battery_standby? Ignored by both eco_charge
        # and general (self-use) — battery discharges normally.
        #
        # Why not discharge_pv? Achieves true 0W idle, but PV
        # surplus would NOT charge battery — exported instead.
        #
        # Empirically tested 2026-02-18: general + charge_pv(0)
        # yields ~47W trickle with PV surplus charging.
        # See idle-charging-analysis.ipynb Section 14.
        - conditions:
            - condition: template
              value_template: "{{ decision == 'idle' }}"
          sequence:
            - action: number.set_value
              target:
                entity_id: number.goodwe_grid_export_limit
              data:
                value: "{{ grid_export_limit_w }}"
            - action: select.select_option
              target:
                entity_id: select.goodwe_inverter_operation_mode
              data:
                option: general
            - action: number.set_value
              target:
                entity_id: number.goodwe_ems_power_limit
              data:
                value: 0
            - action: select.select_option
              target:
                entity_id: select.goodwe_ems_mode
              data:
                option: charge_pv
            - delay:
                seconds: 2
            - action: goodwe.set_parameter
              data:
                device_id: "{{ goodwe_device_id }}"
                parameter: battery_charge_current
                value: "{{ default_charge_current }}"
            - action: goodwe.set_parameter
              data:
                device_id: "{{ goodwe_device_id }}"
                parameter: battery_discharge_current
                value: "{{ default_discharge_current }}"

      # --- HOLD: idle suppressed, keep current mode ---
      # The optimizer said idle but streak < threshold.
      # Do nothing — let the previous charge/discharge continue.
      default: []
  mode: restart

# ===========================================================================
# Failsafe
# ===========================================================================

- id: "1770700000004"
  alias: EMHASS Failsafe
  description: >-
    If EMHASS hasn't published for >20 min, switch to general mode.
    Battery self-consumes for house loads, PV charges battery and
    powers house. This is safe at any SOC because
    depth_of_discharge_backup=97% ensures the backup output stays
    energized down to 3% SOC (below the on-grid floor of 5%).
    Checks every 7 min.

    Uses input_datetime.emhass_last_publish as a heartbeat rather
    than sensor.p_batt_forecast.last_updated, because HA does not
    bump last_updated when EMHASS posts identical state+attributes
    (common during flat forecast periods). The heartbeat is set by
    the MPC Loop automation after every successful publish cycle.

    Availability guard: skips when GoodWe sensors are unavailable.
    The goodwe library has a single _consecutive_failures_count on
    the Inverter object, shared by reads (coordinator) AND writes
    (automations). The coordinator tolerates 2 consecutive failures
    before marking sensors unavailable — but write failures also
    increment the counter. With continue_on_error, this automation
    attempts 5+ writes even when the inverter is down: each takes
    10 retries × 1s timeout = 50s of socket hammering every 7 min,
    pushing the counter far past 3 and preventing recovery. The
    guard breaks this feedback loop: no writes → coordinator polls
    uncontested → counter resets on first success → sensors recover
    → automations resume.
  triggers:
    - minutes: /7
      trigger: time_pattern
  conditions:
    - condition: template
      value_template: >-
        {% set stale_threshold_sec = 1200 %}
        {% set hb_ts = state_attr('input_datetime.emhass_last_publish', 'timestamp') %}
        {{ hb_ts is none or
           (as_timestamp(now()) - hb_ts) > stale_threshold_sec }}
    # Guard: don't write to the inverter when it's unreachable.
    # The Failsafe uses continue_on_error which means it attempts ALL
    # 5+ writes even when the inverter is down. Each failed write takes
    # 10 retries × 1s = 10s, totalling ~50s of socket hammering every
    # 7 min — preventing the coordinator from recovering. Better to
    # skip entirely and let the coordinator recover uncontested.
    # The inverter keeps running in its last-set mode until it's
    # reachable again.
    - condition: template
      value_template: >-
        {{ states('sensor.goodwe_battery_state_of_charge') not in ['unknown', 'unavailable'] }}
  actions:
    - variables:
        goodwe_device_id: "ea2d8925fee08c1321c7f038b61e111e"
        default_charge_current: 25
        default_discharge_current: 25
        grid_export_limit_w: 10000
    - action: number.set_value
      target:
        entity_id: number.goodwe_grid_export_limit
      data:
        value: "{{ grid_export_limit_w }}"
      continue_on_error: true
    - action: select.select_option
      target:
        entity_id: select.goodwe_inverter_operation_mode
      data:
        option: general
      continue_on_error: true
    - action: select.select_option
      target:
        entity_id: select.goodwe_ems_mode
      data:
        option: auto
      continue_on_error: true
    - delay:
        seconds: 2
    - action: goodwe.set_parameter
      data:
        device_id: "{{ goodwe_device_id }}"
        parameter: battery_charge_current
        value: "{{ default_charge_current }}"
      continue_on_error: true
    - action: goodwe.set_parameter
      data:
        device_id: "{{ goodwe_device_id }}"
        parameter: battery_discharge_current
        value: "{{ default_discharge_current }}"
      continue_on_error: true
    - action: persistent_notification.create
      data:
        title: "EMHASS Failsafe Triggered"
        message: >-
          p_batt_forecast stale >20 min. General mode activated.
          Battery self-consumes, PV charges. EMHASS not controlling.
  mode: single

# ===========================================================================
# EV Charging (EVCC executor + EMHASS deferrable load)
#   input_boolean.ev_charge_requested   = HA schedule claim
#   input_boolean.ev_charge_kill_switch = emergency-only hard stop
#   input_number.ev_target_soc          = known-vehicle target SOC
#   input_number.ev_target_energy_kwh   = guest-vehicle energy target
#   input_datetime.ev_ready_by          = HA schedule deadline
#   sensor.p_deferrable0                = continuous EMHASS power profile
#
# With no HA schedule claim, this section must not write to EVCC. EVCC owns
# its own PV, Now, Off, plan, current, and phase controls in that state.
# ===========================================================================

- id: "1770700000013"
  alias: EV Schedule - Validate Request
  description: >-
    On toggle-on: rejects a past deadline and warns when SOC is unavailable.
    An unavailable SOC is valid for a guest vehicle, which uses the energy
    target instead.
  triggers:
    - trigger: state
      entity_id: input_boolean.ev_charge_requested
      to: "on"
  conditions: []
  actions:
    - variables:
        cur: "{{ states('sensor.evcc_loadpoint_1_soc') | float(-1) }}"
        vehicle: "{{ states('sensor.evcc_loadpoint_1_vehicle') }}"
        tgt: "{{ states('input_number.ev_target_soc') | float(80) }}"
        guest_target: "{{ states('input_number.ev_target_energy_kwh') | float(0) }}"
        ready_ts: "{{ state_attr('input_datetime.ev_ready_by', 'timestamp') | float(0) }}"
        now_ts: "{{ as_timestamp(now()) }}"
        deadline_past: "{{ ready_ts <= now_ts }}"
        guest_vehicle: "{{ vehicle in ['', 'guest', 'unknown', 'unavailable'] }}"
    - choose:
        # Hard reject: deadline in the past
        - conditions:
            - condition: template
              value_template: >-
                {{ (deadline_past | bool) or
                   ((guest_vehicle | bool) and guest_target | float <= 0) }}
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.ev_charge_requested
            - action: persistent_notification.create
              data:
                title: "❌ EV Schedule Rejected"
                message: >-
                  {% if guest_vehicle | bool and guest_target | float <= 0 and not deadline_past | bool %}
                  Guest target energy is zero. Set it before scheduling.
                  {% else %}
                  Deadline ({{ states('input_datetime.ev_ready_by') }}) is in
                  the past. Update the Ready By time and try again.
                  {% endif %}
                notification_id: ev_charge_rejected
      default:
        # Soft warn: SOC looks odd but request goes through
        - condition: template
          value_template: "{{ (cur >= 0 and tgt <= cur) or cur < 0 }}"
        - action: persistent_notification.create
          data:
            title: "⚠️ EV Schedule — Heads Up"
            message: >-
              {% if cur >= 0 and tgt <= cur %}
              🔋 Target SOC ({{ tgt | int }}%) ≤ current SOC ({{ cur | int }}%).
              {% endif %}
              {% if cur < 0 %}
              🚗 Car SOC unavailable (car may be asleep).
              {% endif %}
              {% if cur < 0 and guest_target <= 0 %}
              Guest target energy is zero. Set it before scheduling.
              {% else %}
              Schedule accepted. EMHASS will use the guest energy target.
              {% endif %}
            notification_id: ev_charge_warning
  mode: single

- id: "1770700000014"
  alias: EV Schedule - Insufficient Time Warning
  description: >-
    Fires when the MPC payload caps ev_hours because the deadline
    is too tight to reach the target SOC. Checked every 4 min.
    Compares required hours vs available hours.
  triggers:
    - minutes: /4
      trigger: time_pattern
  conditions:
    - condition: state
      entity_id: input_boolean.ev_charge_requested
      state: "on"
    - condition: template
      value_template: >-
        {{ is_state('sensor.evcc_loadpoint_1_connected', 'true') }}
    - condition: template
      value_template: >-
        {% set ev_soc = states('sensor.evcc_loadpoint_1_soc') | float(-1) %}
        {% set ev_target = states('input_number.ev_target_soc') | float(80) %}
        {% set ev_battery_kwh = 77 %}
        {% set ev_charge_kw = 11.04 %}
        {% set ev_charge_overhead = 1.05 %}
        {% set slot_seconds = 900 %}
        {% set ready_ts = state_attr('input_datetime.ev_ready_by', 'timestamp') | float(0) %}
        {% set slots_left = ((ready_ts - as_timestamp(now())) / slot_seconds) | int %}
        {% set hours_needed = ((ev_target - ev_soc) / 100 * ev_battery_kwh / ev_charge_kw * ev_charge_overhead) %}
        {% set hours_available = slots_left * 15 / 60 %}
        {{ ev_soc >= 0 and ev_soc < ev_target and slots_left > 0 and hours_needed > hours_available }}
  actions:
    - variables:
        ev_soc: "{{ states('sensor.evcc_loadpoint_1_soc') | float(0) }}"
        ev_target: "{{ states('input_number.ev_target_soc') | float(80) }}"
        ev_battery_kwh: 77
        ev_charge_kw: 11.04
        slot_seconds: 900
        ready_ts: "{{ state_attr('input_datetime.ev_ready_by', 'timestamp') | float(0) }}"
        slots_left: "{{ ((ready_ts - as_timestamp(now())) / slot_seconds) | int }}"
        hours_available: "{{ (slots_left * 15 / 60) | round(1) }}"
        reachable_soc: >-
          {{ (ev_soc | float + (slots_left | int * 0.25 * ev_charge_kw / ev_battery_kwh * 100))
             | round(0) | int }}
    - action: persistent_notification.create
      data:
        title: "⚡ EV Charge — Not Enough Time"
        message: >-
          Only {{ hours_available }}h left until deadline
          ({{ states('input_datetime.ev_ready_by') }}).
          Will charge at max power but can only reach ~{{ reachable_soc }}%
          instead of {{ ev_target | int }}%.
          Extend the deadline or lower the target SOC.
        notification_id: ev_insufficient_time
  mode: single

- id: "1770700000010"
  alias: EV Schedule - Execute EMHASS Profile via EVCC
  description: >-
    Claims EVCC only while the HA schedule request is active. Outside that
    state this automation is deliberately silent so EVCC can operate its own
    PV, Now, Off, plan, current, and phase controls without interference.
    During a schedule, EMHASS owns the power trajectory and this automation
    converts the current slot to a fixed phase/current command for EVCC.
  triggers:
    - trigger: time_pattern
      minutes: "/1"
    - trigger: state
      entity_id: sensor.p_deferrable0
    - trigger: state
      entity_id:
        - input_boolean.ev_charge_requested
        - input_boolean.ev_charge_kill_switch
        - input_number.ev_target_soc
        - input_number.ev_target_energy_kwh
        - input_datetime.ev_ready_by
        - input_datetime.emhass_last_publish
        - sensor.evcc_loadpoint_1_connected
        - sensor.evcc_loadpoint_1_soc
        - sensor.evcc_loadpoint_1_mode
        - sensor.evcc_loadpoint_1_charging
        - sensor.evcc_loadpoint_1_configured_phases
        - sensor.evcc_loadpoint_1_max_current
    - trigger: event
      event_type: ev_charge_executor_refresh
  actions:
    - variables:
        p_def: "{{ states('sensor.p_deferrable0') | float(0) }}"
        requested: "{{ is_state('input_boolean.ev_charge_requested', 'on') }}"
        kill_switch: "{{ is_state('input_boolean.ev_charge_kill_switch', 'on') }}"
        connected: "{{ is_state('sensor.evcc_loadpoint_1_connected', 'true') }}"
        deadline: "{{ state_attr('input_datetime.ev_ready_by', 'timestamp') | float(0) }}"
        deadline_valid: "{{ deadline > as_timestamp(now()) }}"
        schedule_active: "{{ (requested | bool) and (deadline_valid | bool) }}"
        executor_active: "{{ is_state('input_boolean.ev_emhass_executor_active', 'on') }}"
        heartbeat: "{{ state_attr('input_datetime.emhass_last_publish', 'timestamp') | float(0) }}"
        heartbeat_fresh: "{{ heartbeat > 0 and (as_timestamp(now()) - heartbeat) <= 1200 }}"
        current_mode: "{{ states('sensor.evcc_loadpoint_1_mode') }}"
        charging: "{{ is_state('sensor.evcc_loadpoint_1_charging', 'true') }}"
        configured_phases: "{{ states('sensor.evcc_loadpoint_1_configured_phases') | int(0) }}"
        effective_min_current: "{{ states('sensor.evcc_loadpoint_1_min_current') | float(6) }}"
        effective_max_current: "{{ states('sensor.evcc_loadpoint_1_max_current') | float(16) }}"
        profile_max_current: >-
          {% if executor_active and states('input_number.evcc_saved_max_current') | is_number %}
            {{ states('input_number.evcc_saved_max_current') | float(16) }}
          {% else %}
            {{ effective_max_current }}
          {% endif %}
        effective_power: "{{ p_def if (connected | bool) else 0 }}"
        minimum_power: "{{ effective_min_current | float * 230 }}"
        one_phase_max_power: "{{ profile_max_current | float * 230 }}"
        slot_chargeable: >-
          {{ (connected | bool) and
             ((effective_power | float) >= (minimum_power | float)) }}
        command_phase: >-
          {% if not slot_chargeable %}
            0
          {% elif effective_power | float <= one_phase_max_power | float %}
            1
          {% else %}
            3
          {% endif %}
        command_current: >-
          {% if not slot_chargeable %}
            0
          {% else %}
            {% set phases = 1 if effective_power | float <= one_phase_max_power | float else 3 %}
            {% set raw = effective_power | float / (230 * phases) %}
            {{ [[raw, effective_min_current | float] | max, profile_max_current | float] | min | round(1) }}
          {% endif %}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ kill_switch | bool }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ current_mode != 'off' or charging }}"
              then:
                - action: select.select_option
                  target:
                    entity_id: select.evcc_corner_charger_mode
                  data:
                    option: off
                - wait_template: "{{ not is_state('sensor.evcc_loadpoint_1_charging', 'true') }}"
                  timeout: "00:00:30"
                  continue_on_timeout: true
        - conditions:
            - condition: template
              value_template: "{{ schedule_active | bool }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ not executor_active | bool }}"
              then:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.evcc_saved_max_current
                  data:
                    value: "{{ states('sensor.evcc_loadpoint_1_max_current') | float(16) }}"
                - action: input_number.set_value
                  target:
                    entity_id: input_number.evcc_saved_phases
                  data:
                    value: "{{ states('sensor.evcc_loadpoint_1_configured_phases') | int(0) }}"
                - action: input_number.set_value
                  target:
                    entity_id: input_number.evcc_saved_charged_energy
                  data:
                    value: "{{ states('sensor.evcc_loadpoint_1_charged_energy') | float(0) }}"
                - action: input_boolean.turn_on
                  target:
                    entity_id: input_boolean.ev_emhass_executor_active
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ not heartbeat_fresh | bool or not slot_chargeable | bool }}"
                  sequence:
                    - if:
                        - condition: template
                          value_template: "{{ current_mode != 'off' or charging }}"
                      then:
                        - action: select.select_option
                          target:
                            entity_id: select.evcc_corner_charger_mode
                          data:
                            option: off
                        - wait_template: "{{ not is_state('sensor.evcc_loadpoint_1_charging', 'true') }}"
                          timeout: "00:00:30"
                          continue_on_timeout: true
                - conditions:
                    - condition: template
                      value_template: "{{ slot_chargeable | bool }}"
                  sequence:
                    - if:
                        - condition: template
                          value_template: >-
                            {{ configured_phases | int != command_phase | int and
                               (current_mode != 'off' or charging) }}
                      then:
                        - action: select.select_option
                          target:
                            entity_id: select.evcc_corner_charger_mode
                          data:
                            option: off
                        - wait_template: "{{ not is_state('sensor.evcc_loadpoint_1_charging', 'true') }}"
                          timeout: "00:00:30"
                          continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ configured_phases | int != command_phase | int }}"
                      then:
                        - action: select.select_option
                          target:
                            entity_id: select.evcc_corner_charger_phases_configured
                          data:
                            option: "{{ command_phase | int }}"
                    - if:
                        - condition: template
                          value_template: >-
                            {{ (states('sensor.evcc_loadpoint_1_max_current') | float(0) - command_current | float(0)) | abs > 0.1 }}
                      then:
                        - action: rest_command.evcc_max_current
                          data:
                            current: "{{ command_current }}"
                    - if:
                        - condition: template
                          value_template: "{{ current_mode != 'now' }}"
                      then:
                        - action: select.select_option
                          target:
                            entity_id: select.evcc_corner_charger_mode
                          data:
                            option: now
      default:
        - if:
            - condition: template
              value_template: "{{ executor_active | bool }}"
          then:
            - if:
                - condition: template
                  value_template: "{{ current_mode != 'off' or charging }}"
              then:
                - action: select.select_option
                  target:
                    entity_id: select.evcc_corner_charger_mode
                  data:
                    option: off
                - wait_template: "{{ not is_state('sensor.evcc_loadpoint_1_charging', 'true') }}"
                  timeout: "00:00:30"
                  continue_on_timeout: true
            - action: rest_command.evcc_max_current
              data:
                current: "{{ states('input_number.evcc_saved_max_current') | float(16) }}"
            - action: select.select_option
              target:
                entity_id: select.evcc_corner_charger_phases_configured
              data:
                option: "{{ states('input_number.evcc_saved_phases') | int(0) }}"
            - if:
                - condition: template
                  value_template: "{{ not kill_switch | bool }}"
              then:
                - action: select.select_option
                  target:
                    entity_id: select.evcc_corner_charger_mode
                  data:
                    option: pv
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.ev_emhass_executor_active
  mode: restart

- id: "1770700000011"
  alias: EV Schedule Complete - SOC Target
  description: >-
    Auto-clears ev_charge_requested only when EV SOC reaches the
    target. Unplugging or leaving home does NOT cancel the request —
    EMHASS naturally can't charge an unplugged car, and the request
    stays active so charging resumes when you plug back in.
  triggers:
    - trigger: state
      entity_id: sensor.evcc_loadpoint_1_soc
    - trigger: state
      entity_id: input_boolean.ev_charge_requested
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.ev_charge_requested
      state: "on"
    - condition: template
      value_template: >-
        {{ states('sensor.evcc_loadpoint_1_soc') | float(0)
           >= states('input_number.ev_target_soc') | float(80) }}
  actions:
    - variables:
        ev_soc: "{{ states('sensor.evcc_loadpoint_1_soc') | float(0) }}"
        ev_target: "{{ states('input_number.ev_target_soc') | float(80) }}"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_charge_requested
    - action: persistent_notification.create
      data:
        title: "🔋 EV Schedule Complete"
        message: >-
          Vehicle reached {{ ev_soc }}% SOC (target: {{ ev_target }}%).
          The EMHASS schedule was cleared at {{ now().strftime('%H:%M') }}.
        notification_id: ev_charge_complete
  mode: single

- id: "1770700000023"
  alias: EV Schedule Complete - Guest Energy Target
  description: >-
    Clears a guest-vehicle schedule after the requested amount of energy has
    been delivered in the current EVCC session.
  triggers:
    - trigger: state
      entity_id: sensor.evcc_loadpoint_1_charged_energy
    - trigger: state
      entity_id: input_boolean.ev_charge_requested
      to: "on"
  conditions:
    - condition: state
      entity_id: input_boolean.ev_charge_requested
      state: "on"
    - condition: template
      value_template: >-
        {{ states('sensor.evcc_loadpoint_1_vehicle') in ['', 'guest', 'unknown', 'unavailable'] }}
    - condition: template
      value_template: >-
        {{ (states('sensor.evcc_loadpoint_1_charged_energy') | float(0) -
            states('input_number.evcc_saved_charged_energy') | float(0)) >=
           states('input_number.ev_target_energy_kwh') | float(0) }}
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_charge_requested
    - action: persistent_notification.create
      data:
        title: "🔋 Guest EV Schedule Complete"
        message: >-
          Guest vehicle received at least {{ states('input_number.ev_target_energy_kwh') }} kWh.
          The EMHASS schedule was cleared at {{ now().strftime('%H:%M') }}.
        notification_id: ev_schedule_complete_guest
  mode: single

- id: "1770700000012"
  alias: EV Schedule Failsafe
  description: >-
    If EMHASS hasn't published for >20 min during an HA-owned schedule, stop
    the EV and clear the schedule. The executor then restores EVCC PV mode.
    With no HA schedule active this automation is completely inert, so a
    manually operated EVCC loadpoint is never touched.
  triggers:
    - minutes: /7
      trigger: time_pattern
  conditions:
    - condition: template
      value_template: >-
        {% set stale_threshold_sec = 1200 %}
        {% set hb_ts = state_attr('input_datetime.emhass_last_publish', 'timestamp') %}
        {{ hb_ts is none or
           (as_timestamp(now()) - hb_ts) > stale_threshold_sec }}
    - condition: state
      entity_id: input_boolean.ev_charge_requested
      state: "on"
    - condition: state
      entity_id: input_boolean.ev_emhass_executor_active
      state: "on"
  actions:
    - action: select.select_option
      target:
        entity_id: select.evcc_corner_charger_mode
      data:
        option: off
    - wait_template: "{{ not is_state('sensor.evcc_loadpoint_1_charging', 'true') }}"
      timeout: "00:00:30"
      continue_on_timeout: true
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_charge_requested
    - action: persistent_notification.create
      data:
        title: "⚠️ EV Charge Failsafe"
        message: >-
          EMHASS stale >20 min. The HA-owned EV schedule was stopped and EVCC
          was released back to Solar mode.
          Time: {{ now().strftime('%H:%M') }}
        notification_id: ev_failsafe
  mode: single

- id: "1770700000022"
  alias: EV Executor Startup Refresh
  description: >-
    Refreshes the mutually exclusive EV executor after Home Assistant starts.
    If no HA schedule is active, this only causes the executor to observe and
    then remain silent; it never forces EVCC out of a user-selected mode.
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    - delay:
        seconds: 15
    - event: ev_charge_executor_refresh
  mode: single

